name: meeting-room-booking

services:
  nest-app:
    build:
      context: ./meeting_room_booking_system_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?set-DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE:-meeting_room_booking_system}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET:?set-JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-meeting-room}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set-MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set-MINIO_ROOT_PASSWORD}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000}
      LOG_LEVEL: ${LOG_LEVEL:-http}
    volumes:
      - uploads-data:/app/uploads
      - logs-data:/app/logs
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/']
      interval: 10s
      timeout: 5s
      retries: 10
      # 启动期要跑数据库迁移，多留点时间
      start_period: 30s
    networks:
      - common-network

  # 对象存储（S3 兼容），用于上传文件练习。
  # 镜像固定在带 Web 控制台的最后一个社区版；管理也可用 mc 命令行。
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ['server', '/data', '--console-address', ':9001']
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set-MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set-MINIO_ROOT_PASSWORD}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - common-network

  frontend:
    # 前端源码随仓库走，部署时本地构建，不依赖外部镜像仓库
    build:
      context: ./meeting_room_booking_system_frontend_user
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      nest-app:
        condition: service_healthy
    environment:
      BACKEND_HOST: nest-app
      BACKEND_PORT: ${PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - common-network

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?set-DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-meeting_room_booking_system}
      MYSQL_USER: ${DB_USERNAME:-booking_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set-DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping --protocol=socket -uroot']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - common-network

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - common-network

volumes:
  mysql-data:
  redis-data:
  uploads-data:
  minio-data:
  logs-data:

networks:
  common-network:
    driver: bridge
